<style>
:root {
  --navy: #0B1B3D;
  --navy-light: #162B55;
  --gold: #C59B27;
  --gold-light: #DFBA4E;
  --gold-pale: #FBF6E9;
  --bg-gray: #F4F6FA;
  --white: #FFFFFF;
  --border: #CBD5E1;
  --text-dark: #1E293B;
  --text-muted: #64748B;
  --radius: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg-gray);
  color: var(--text-dark);
  line-height: 1.6;
}

/* TOP HEADER */
header {
  background: var(--navy);
  color: var(--white);
  border-bottom: 4px solid var(--gold);
  padding: 14px 20px;
}
.header-wrap {
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.brand-box {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-title {
  font-family: 'Cinzel', serif;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.brand-sub {
  font-size: 0.75rem;
  color: var(--gold-light);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.home-link {
  color: #E2E8F0;
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 6px;
  background: rgba(255,255,255,0.08);
  transition: 0.2s;
}
.home-link:hover {
  background: var(--gold);
  color: var(--navy);
}

/* MAIN FORM CONTAINER */
.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 16px;
}
.portal-card {
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 4px 18px rgba(11,27,61,0.06);
  padding: 28px 24px;
  margin-bottom: 30px;
}
.portal-header {
  text-align: center;
  margin-bottom: 22px;
}
.portal-header h2 {
  font-family: 'Cinzel', serif;
  font-size: 1.6rem;
  color: var(--navy);
  margin-bottom: 6px;
}
.portal-header p {
  color: var(--text-muted);
  font-size: 0.92rem;
}

.search-form {
  display: grid;
  grid-template-columns: 1.2fr 1fr 2fr auto;
  gap: 12px;
  align-items: end;
}
@media (max-width: 768px) {
  .search-form { grid-template-columns: 1fr; }
}

.form-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-control {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.92rem;
  background: #F8FAFC;
}
.form-control:focus {
  outline: none;
  border-color: var(--navy);
  background: #FFF;
}
.btn-submit {
  padding: 11px 22px;
  background: var(--navy);
  color: var(--white);
  border: none;
  border-radius: 6px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: 0.2s;
  height: 44px;
}
.btn-submit:hover {
  background: var(--navy-light);
}

#statusMsg {
  margin-top: 15px;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 0.9rem;
  display: none;
}
.msg-error {
  background: #FEE2E2;
  color: #991B1B;
  border: 1px solid #FCA5A5;
}
.msg-success {
  background: #DCFCE7;
  color: #166534;
  border: 1px solid #86EFAC;
}

/* MARKS CARD ACTION BAR */
.action-bar {
  display: none;
  justify-content: space-between;
  align-items: center;
  background: var(--white);
  border: 1px solid var(--border);
  padding: 14px 20px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.action-bar-title {
  font-weight: 700;
  color: var(--navy);
  font-size: 0.95rem;
}
.action-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn-action {
  padding: 9px 18px;
  border: none;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: 0.2s;
}
.btn-pdf { background: #DC2626; color: #FFF; }
.btn-pdf:hover { background: #B91C1C; }
.btn-img { background: #2563EB; color: #FFF; }
.btn-img:hover { background: #1D4ED8; }
.btn-print { background: var(--navy); color: #FFF; }
.btn-print:hover { background: var(--navy-light); }

/* AUTHENTIC PROGRESS REPORT CARD CONTAINER */
#reportCardContainer {
  display: none;
}
.hpr-sheet {
  background: #FFFFFF;
  padding: 35px 30px;
  border: 2px solid #000;
  margin: 0 auto 40px;
  color: #000;
  font-family: 'Times New Roman', Times, serif;
  box-shadow: 0 4px 25px rgba(0,0,0,0.08);
  position: relative;
}
.hpr-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid #000;
  padding-bottom: 12px;
  margin-bottom: 14px;
}
.hpr-crest { width: 70px; height: 70px; }
.hpr-header-center { text-align: center; flex: 1; }
.hpr-school-title {
  font-size: 1.55rem;
  font-weight: 900;
  color: #0B1B3D;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.hpr-school-sub {
  font-size: 0.95rem;
  font-weight: bold;
  letter-spacing: 1px;
}
.hpr-title-badge {
  display: inline-block;
  background: #0B1B3D;
  color: #FFF;
  padding: 3px 14px;
  font-size: 0.82rem;
  font-weight: bold;
  letter-spacing: 1.5px;
  border-radius: 3px;
  margin-top: 4px;
}

.hpr-meta-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 12px;
  font-size: 0.88rem;
}
.hpr-meta-table td {
  padding: 4px 6px;
  border: 1px solid #444;
}
.meta-lbl {
  font-weight: bold;
  background: #F8FAFC;
  width: 18%;
}
.meta-val {
  width: 32%;
}

.hpr-marks-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 12px;
  font-size: 0.8rem;
  text-align: center;
}
.hpr-marks-table th, .hpr-marks-table td {
  border: 1px solid #000;
  padding: 4.5px 3px;
}
.hpr-marks-table th {
  background: #EEF2F6;
  font-weight: bold;
}
.sub-name {
  text-align: left;
  font-weight: bold;
  padding-left: 8px;
}

.hpr-score-summary {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 12px;
  font-size: 0.9rem;
  text-align: center;
}
.hpr-score-summary th, .hpr-score-summary td {
  border: 1px solid #000;
  padding: 6px;
}
.hpr-score-summary th {
  background: #0B1B3D;
  color: #FFF;
}

.hpr-details-strip {
  display: flex;
  justify-content: space-between;
  border: 1px solid #444;
  padding: 6px 12px;
  font-size: 0.85rem;
  background: #F8FAFC;
  margin-bottom: 12px;
}
.hpr-grading-box {
  border: 1px solid #444;
  padding: 4px 8px;
  font-size: 0.74rem;
  text-align: center;
  background: #FFF;
  margin-bottom: 18px;
}

.hpr-signatures {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 8px 24px 0;
  margin-top: 10px;
}
.sig-block {
  text-align: center;
  font-size: 0.82rem;
  font-weight: bold;
}

.hpr-footer-note {
  font-size: 0.72rem;
  font-style: italic;
  color: #475569;
  text-align: center;
  margin-top: 14px;
  border-top: 1px dashed #AAA;
  padding-top: 5px;
}

/* PRINT MEDIA */
@media print {
  header, .portal-card, .action-bar, footer { display: none !important; }
  body { background: #FFF !important; padding: 0 !important; }
  .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
  #reportCardContainer { display: block !important; }
  .hpr-sheet { border: 2px solid #000 !important; box-shadow: none !important; margin: 0 !important; padding: 20px !important; width: 100% !important; }
}
</style>
</head>

</header>

<main class="container">

  <!-- STUDENT LOOKUP CARD -->
  <div class="portal-card">
    <div class="portal-header">
      <h2>View & Download Student Marks Card</h2>
      <p>Enter the student's Class, Roll Number, and Full Name as registered in school records.</p>
    </div>

    <form class="search-form" id="lookupForm" onsubmit="handleLookup(event)">
      <div class="form-group">
        <label for="studentClass">Class</label>
        <select id="studentClass" class="form-control" required>
          <option value="">Select Class</option>
          <option value="Nursery">Nursery</option>
          <option value="LKG">LKG</option>
          <option value="UKG">UKG</option>
          <option value="1st">Class 1st</option>
          <option value="2nd">Class 2nd</option>
          <option value="3rd">Class 3rd</option>
          <option value="4th">Class 4th</option>
          <option value="5th">Class 5th</option>
          <option value="6th">Class 6th</option>
          <option value="7th">Class 7th</option>
          <option value="8th">Class 8th</option>
        </select>
      </div>

      <div class="form-group">
        <label for="studentRoll">Roll Number</label>
        <input type="number" id="studentRoll" class="form-control" placeholder="e.g. 1" required>
      </div>

      <div class="form-group">
        <label for="studentName">Student Full Name</label>
        <input type="text" id="studentName" class="form-control" placeholder="e.g. Muzamil Fayaz Ganaie" required>
      </div>

      <button type="submit" class="btn-submit">Search Marks Card</button>
    </form>

    <div id="statusMsg"></div>
  </div>

  <!-- EXPORT & PRINT BUTTON BAR -->
  <div id="actionBar" class="action-bar">
    <div class="action-bar-title" id="actionStudentLabel">Marks Card Ready</div>
    <div class="action-buttons">
      <button class="btn-action btn-pdf" onclick="downloadMarksCardPDF()">
        &#128196; Download PDF
      </button>
      <button class="btn-action btn-img" onclick="downloadMarksCardImage()">
        &#128247; Download Image (PNG)
      </button>
      <button class="btn-action btn-print" onclick="window.print()">
        &#128424; Print Card
      </button>
    </div>
  </div>

  <!-- MARKS CARD REPORT SHEET AREA -->
  <div id="reportCardContainer">
    <div id="hprSheet" class="hpr-sheet">
      <!-- Injected by JavaScript on search -->
    </div>
  </div>

</main>

let activeStudent = null;

function handleLookup(e) {
  e.preventDefault();
  const cls = document.getElementById("studentClass").value.trim();
  const roll = parseInt(document.getElementById("studentRoll").value.trim(), 10);
  const nameQuery = document.getElementById("studentName").value.trim().toLowerCase();
  const msg = document.getElementById("statusMsg");
  const actionBar = document.getElementById("actionBar");
  const container = document.getElementById("reportCardContainer");

  // Lookup matching student
  const student = STUDENTS.find(s => 
    s.class.toLowerCase() === cls.toLowerCase() &&
    s.roll === roll &&
    s.name.toLowerCase().includes(nameQuery)
  );

  if (!student) {
    msg.className = "msg-error";
    msg.style.display = "block";
    msg.textContent = "No verified marks card found. Please check your Class, Roll Number, and Name spelling.";
    actionBar.style.display = "none";
    container.style.display = "none";
    return;
  }

  activeStudent = student;
  msg.className = "msg-success";
  msg.style.display = "block";
  msg.textContent = `Record found: ${student.name} (Class ${student.class}, Roll #${student.roll})`;

  document.getElementById("actionStudentLabel").innerHTML = `Marks Card: <strong>${student.name}</strong> &bull; Class: ${student.class}`;
  actionBar.style.display = "flex";

  renderHPR(student);
  container.style.display = "block";
  container.scrollIntoView({ behavior: 'smooth' });
}

// 1. PDF DOWNLOAD
function downloadMarksCardPDF() {
  if (!activeStudent) return;
  const element = document.getElementById("hprSheet");
  const filename = `ABMT_Class_${activeStudent.class}_Roll_${activeStudent.roll}_${activeStudent.name.replace(/\s+/g, '_')}_Marks_Card.pdf`;
  const opt = {
    margin: [6, 6, 6, 6],
    filename: filename,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
}

// 2. IMAGE (PNG) DOWNLOAD
function downloadMarksCardImage() {
  if (!activeStudent) return;
  const element = document.getElementById("hprSheet");
  const filename = `ABMT_Class_${activeStudent.class}_Roll_${activeStudent.roll}_${activeStudent.name.replace(/\s+/g, '_')}_Marks_Card.png`;
  
  html2canvas(element, { scale: 2, useCORS: true }).then(canvas => {
    const link = document.createElement("a");
    link.download = filename;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}
