let activeStudent = null;

function normalize(str) {
  return (str || "").toLowerCase().replace(/[^a-z0-9]/g, '');
}

function handleLookup(e) {
  e.preventDefault();
  
  // Clean inputs
  let cls = document.getElementById("studentClass").value.trim().toLowerCase();
  cls = cls.replace(/^class\s*/i, ''); // handles "8th" or "Class 8th"
  
  const roll = parseInt(document.getElementById("studentRoll").value.trim(), 10);
  const nameQuery = normalize(document.getElementById("studentName").value.trim());

  const msg = document.getElementById("statusMsg");
  const actionBar = document.getElementById("actionBar");
  const container = document.getElementById("reportCardContainer");

  // Search by roll and fuzzy matching on name
  const student = STUDENTS.find(s => {
    const sClass = s.class.toLowerCase().replace(/^class\s*/i, '');
    const classMatch = (sClass === cls);
    const rollMatch = (s.roll === roll);
    const sName = normalize(s.name);
    const nameMatch = sName.includes(nameQuery) || nameQuery.includes(sName);
    return classMatch && rollMatch && nameMatch;
  });

  if (!student) {
    msg.className = "msg-error";
    msg.style.display = "block";
    msg.textContent = "No verified marks card found. Please check your Class, Roll Number, and Name spelling.";
    actionBar.style.display = "none";
    container.style.display = "none";
    return;
  }

  activeStudent = student;
  msg.className = "msg-success";
  msg.style.display = "block";
  msg.textContent = `Record found: ${student.name} (Class ${student.class}, Roll #${student.roll})`;

  document.getElementById("actionStudentLabel").innerHTML = `Marks Card: <strong>${student.name}</strong> &bull; Class: ${student.class}`;
  actionBar.style.display = "flex";

  renderHPR(student);
  container.style.display = "block";
  container.scrollIntoView({ behavior: 'smooth' });
}

function downloadMarksCardPDF() {
  if (!activeStudent) return;
  const element = document.getElementById("hprSheet");
  const filename = `ABMT_Class_${activeStudent.class}_Roll_${activeStudent.roll}_${activeStudent.name.replace(/\s+/g, '_')}_Marks_Card.pdf`;
  const opt = {
    margin: [6, 6, 6, 6],
    filename: filename,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
}

function downloadMarksCardImage() {
  if (!activeStudent) return;
  const element = document.getElementById("hprSheet");
  const filename = `ABMT_Class_${activeStudent.class}_Roll_${activeStudent.roll}_${activeStudent.name.replace(/\s+/g, '_')}_Marks_Card.png`;
  
  html2canvas(element, { scale: 2, useCORS: true }).then(canvas => {
    const link = document.createElement("a");
    link.download = filename;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}
