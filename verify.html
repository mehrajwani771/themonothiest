<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification Portal - The Monotheist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-certificate, #printable-certificate * { visibility: visible; }
            #printable-certificate { position: absolute; left: 0; top: 0; width: 100%; margin: 0; box-shadow: none; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div>
                <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">The Monotheist</span>
                <h1 class="text-lg font-cinzel font-bold text-white tracking-wide">Certificate Verification Portal</h1>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg transition">Back to Home</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-cinzel font-bold text-white mb-2">Verify Student Achievement</h2>
            <p class="text-slate-400 text-sm">Enter student details or certificate ID to instantly inspect and verify credentials.</p>
        </div>

        <!-- Search Box Card -->
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Student Name</label>
                    <input type="text" id="searchName" placeholder="e.g. Seerat Lateef" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Roll Number / ID</label>
                    <input type="text" id="searchRoll" placeholder="e.g. 1 or TM-8-2026-001" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="verifyCertificate()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-amber-500/10">Verify Certificate</button>
                <button onclick="clearSearch()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium py-3 px-5 rounded-xl transition">Clear</button>
            </div>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="hidden"></div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        &copy; 2026 The Monotheist &bull; Official Student Certification System
    </footer>

    <script>
        // Complete dataset of all 13 certified students
        const students = [
            { roll: "1", name: "Seerat Lateef", certNo: "TM-8-2026-001", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "2", name: "Faisal Majeed", certNo: "TM-8-2026-002", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "3", name: "Mohammad Azan Ganaie", certNo: "TM-8-2026-003", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "4", name: "Junaid Ahmad Dar", certNo: "TM-8-2026-004", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "5", name: "Hafsa Gulzar", certNo: "TM-8-2026-005", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "6", name: "Adnan Fayaz Wani", certNo: "TM-8-2026-006", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "7", name: "Suhaib Mohsin", certNo: "TM-8-2026-007", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "8", name: "Tahmeed Tariq", certNo: "TM-8-2026-008", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "9", name: "Arfaat Aashiq Ganaie", certNo: "TM-8-2026-009", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "10", name: "Hazim Aijaz", certNo: "TM-8-2026-010", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "11", name: "Sadiya Farooq", certNo: "TM-8-2026-011", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "12", name: "Sabiq Ahmad Wani", certNo: "TM-8-2026-012", issueDate: "07-Nov-2026", class: "Class 8th" },
            { roll: "13", name: "Tabasum Bashir", certNo: "TM-8-2026-013", issueDate: "07-Nov-2026", class: "Class 8th" }
        ];

        // Auto-detect URL query params on page load (e.g. ?id=TM-8-2026-001 or ?roll=1)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            const rollParam = urlParams.get('roll');
            const nameParam = urlParams.get('name');

            if (idParam) {
                document.getElementById('searchRoll').value = idParam;
                verifyCertificate();
            } else if (rollParam) {
                document.getElementById('searchRoll').value = rollParam;
                verifyCertificate();
            } else if (nameParam) {
                document.getElementById('searchName').value = nameParam;
                verifyCertificate();
            }
        });

        function verifyCertificate() {
            const nameQuery = document.getElementById('searchName').value.trim().toLowerCase();
            const rollQuery = document.getElementById('searchRoll').value.trim().toLowerCase();
            const container = document.getElementById('resultContainer');

            if (!nameQuery && !rollQuery) {
                container.innerHTML = `
                    <div class="bg-rose-500/10 border border-rose-500/30 rounded-2xl p-6 text-center text-rose-300">
                        Please enter a student name or roll number/certificate ID.
                    </div>`;
                container.classList.remove('hidden');
                return;
            }

            const matched = students.find(s => {
                const matchName = nameQuery ? s.name.toLowerCase().includes(nameQuery) : true;
                const matchRoll = rollQuery ? (s.roll.toLowerCase() === rollQuery || s.certNo.toLowerCase().includes(rollQuery)) : true;
                if (nameQuery && rollQuery) return matchName && matchRoll;
                return nameQuery ? matchName : matchRoll;
            });

            if (matched) {
                container.innerHTML = `
                    <div class="space-y-6">
                        <!-- Verification Status Badge -->
                        <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-4 flex items-center justify-between text-emerald-300">
                            <div class="flex items-center space-x-3">
                                <div class="w-3 h-3 bg-emerald-400 rounded-full animate-pulse"></div>
                                <span class="font-semibold text-sm">Official Certificate Verified Successfully</span>
                            </div>
                            <span class="text-xs bg-emerald-500/20 px-2.5 py-1 rounded-full font-mono">${matched.certNo}</span>
                        </div>

                        <!-- Certificate Display Card -->
                        <div id="printable-certificate" class="bg-[#fbf9f4] text-slate-900 border-8 border-amber-100 rounded-2xl p-8 sm:p-12 shadow-2xl relative overflow-hidden">
                            <div class="text-center space-y-4">
                                <div class="text-xs uppercase tracking-[0.3em] font-bold text-amber-700">The Monotheist</div>
                                <h3 class="font-cinzel text-2xl sm:text-4xl font-bold tracking-wide text-slate-900">Certificate of Appreciation</h3>
                                <p class="text-xs uppercase tracking-wider text-slate-500 pt-2">This certificate is proudly presented to</p>
                                <div class="font-cinzel text-2xl sm:text-3xl font-bold text-amber-900 underline decoration-amber-400/60 underline-offset-8 py-2">${matched.name}</div>
                                <p class="text-xs font-semibold uppercase text-slate-600">${matched.class} &bull; Roll No: ${matched.roll}</p>
                                
                                <p class="text-xs sm:text-sm text-slate-700 max-w-lg mx-auto pt-4 leading-relaxed">
                                    in recognition of sincere effort, curiosity and steady progress in the Computer course, covering <strong>Prompt Engineering (AI)</strong>, <strong>Internet Fundamentals</strong>, <strong>Google Workspace</strong>, and <strong>Microsoft Office</strong>.
                                </p>

                                <div class="grid grid-cols-2 gap-4 pt-10 border-t border-slate-300 mt-8 text-left text-xs">
                                    <div>
                                        <p class="text-slate-500 uppercase font-semibold">Date of Issue</p>
                                        <p class="font-bold text-slate-800">${matched.issueDate}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-slate-500 uppercase font-semibold">Instructor / Authority</p>
                                        <p class="font-bold text-slate-800 font-cinzel">The Monotheist</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex gap-4">
                            <button onclick="window.print()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold py-3 px-6 rounded-xl transition flex items-center justify-center space-x-2">
                                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                                <span>Print / Save PDF</span>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-6 text-center text-amber-300">
                        <p class="font-semibold mb-1">No Matching Certificate Found</p>
                        <p class="text-xs text-amber-400/80">Please check the spelling of the name or verify the roll number / certificate ID.</p>
                    </div>`;
            }
            container.classList.remove('hidden');
        }

        function clearSearch() {
            document.getElementById('searchName').value = '';
            document.getElementById('searchRoll').value = '';
            document.getElementById('resultContainer').classList.add('hidden');
        }
    </script>
</body>
</html>
